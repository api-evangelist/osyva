name: Osyva
description: >-
  Osyva is a B2B commerce and procurement platform for the veterinary supply
  sector in Colombia and Latin America ("Gestiona tus compras veterinarias"),
  connecting veterinary clinics, distributors, and buyers to manage the ordering
  and purchasing of veterinary products and pharmaceuticals. Backed by 500
  Global, Osyva runs a web and mobile application (osyva.com, osyva2go.com) and
  the related Hubu brand (hubu.com.co). Its platform is powered by internal API
  hosts (api.osyva.com, api.osyva2go.com), but as of this profile it publishes
  no public developer portal, documentation, or API specification, so its API
  surface is private.
